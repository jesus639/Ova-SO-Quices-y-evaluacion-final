<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVA Sistemas Operativos – Quices y Evaluación Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07101a;--panel:#0d1a28;--line:#1c3147;--tx:#e6f1f7;--mut:#8fa8b9;--mint:#2de2a0;--cy:#36e0ff;--ok:#2de2a0;--bad:#ff6b7d;--c:#2de2a0;--nav:62px;--opt:var(--opt);--soft:rgba(255,255,255,.05);--navbg:rgba(7,16,26,.92);--grid:rgba(54,224,255,.11)}
[data-theme=light]{--bg:#eef4f8;--panel:#fff;--line:#c9d8e3;--tx:#0d1b2a;--mut:#4a6073;--cy:#0a7f9c;--ok:#0b9c6b;--bad:#d6334a;--opt:#f3f8fb;--soft:rgba(0,0,0,.05);--navbg:rgba(238,244,248,.92);--grid:rgba(10,127,156,.08)}
[data-theme=light] .h2,[data-theme=light] .tile h3,[data-theme=light] .side .box h3,[data-theme=light] nav button.on,[data-theme=light] .score{color:color-mix(in srgb,var(--c) 66%,#000)}
[data-theme=light] section::after{opacity:.11}
.ctl{position:fixed;top:12px;right:14px;z-index:40;display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.ctl button{background:none;border:0;color:var(--tx);font:600 .85rem 'Chakra Petch',sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.ctl button:hover,.ctl button:focus-visible{background:var(--mint);color:#04110c;outline:none}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.6 'IBM Plex Sans',system-ui,sans-serif;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
h1,h2,h3{font-family:'Chakra Petch',system-ui,sans-serif;line-height:1.15}
.top{background:#fff;padding:12px 20px;border-bottom:4px solid var(--mint)}
.top img{display:block;height:54px;max-width:100%}
nav{position:sticky;top:0;z-index:20;background:var(--navbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);height:var(--nav)}
nav ul{list-style:none;padding:0;max-width:1100px;height:100%;margin:0 auto;display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:0 150px 0 12px;scrollbar-width:none}
nav button{height:100%;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 .98rem 'Chakra Petch',sans-serif;padding:0 16px;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s,background .2s}
nav button:hover,nav button:focus-visible{color:var(--tx);background:var(--soft);outline:none}
nav button.on{color:var(--c);border-bottom-color:var(--c)}
section{position:relative;overflow:hidden;scroll-margin-top:var(--nav);min-height:calc(100vh - var(--nav));padding:64px 20px;border-bottom:1px solid var(--line);
background-image:radial-gradient(60% 55% at 92% 8%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),radial-gradient(50% 45% at 0% 100%,color-mix(in srgb,var(--c) 9%,transparent),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px}
section::after{content:attr(data-n);position:absolute;right:3%;bottom:-.12em;font:700 clamp(9rem,26vw,22rem)/1 'Chakra Petch',sans-serif;color:var(--c);opacity:.07;pointer-events:none;user-select:none}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:30px;align-items:start}
.side{margin-top:28px;display:grid;gap:12px}
.side>h3{font-size:1.05rem;color:var(--tx)}
.side .box{border-left:3px solid var(--c);padding:14px 16px}
.side .box h3{color:var(--c);font-size:1rem;margin-bottom:4px}
.side .box p{font-size:.9rem}
.side .tip{border:1px dashed var(--c);border-radius:10px;padding:12px 16px;font-size:.9rem;color:var(--mut)}
@media(max-width:860px){.split{grid-template-columns:1fr}.side{margin-top:0}}
.in{max-width:1100px;margin:0 auto;position:relative;z-index:1}
.hero h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:700;max-width:14ch}
.hero .cur{display:inline-block;width:.45em;height:.85em;background:var(--mint);vertical-align:-.1em;margin-left:8px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.lead{color:var(--mut);max-width:62ch;margin-top:18px;font-size:1.08rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:34px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 4px 14px;padding:20px}
.box h3{font-size:1.15rem;margin-bottom:8px;color:var(--cy)}
.box p,.box li{color:var(--mut);font-size:.95rem}
.box ol,.box ul{padding-left:1.1em}
.tile{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;border-left:5px solid var(--c);transition:transform .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 1px var(--c),0 8px 28px -8px var(--c);outline:none}
.tile h3{color:var(--c);font-size:1.3rem}
.tile ul{list-style:none;padding:0;margin:8px 0 12px}
.tile b{font-size:.9rem;color:var(--tx)}
.h2{font-size:clamp(1.7rem,5vw,2.6rem);font-weight:700;color:var(--c)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.sum span{border:1px solid var(--c);border-radius:999px;padding:3px 14px;font-size:.9rem}
.sum span.no{border-color:var(--line);color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:4px 16px 4px 16px;padding:clamp(18px,4vw,34px);margin-top:28px;scroll-margin-top:calc(var(--nav) + 14px)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;gap:10px}
.card h3{font-size:clamp(1.15rem,3vw,1.5rem);margin-bottom:20px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--opt);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--c);outline:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(45,226,160,.13)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,125,.13)}
.fb{margin:16px 0 0;padding:12px 16px;border-left:4px solid var(--c);background:var(--soft);border-radius:0 8px 8px 0;font-size:.95rem}
.btn{background:var(--c);color:#04110c;border:0;border-radius:999px;padding:11px 26px;font:600 1rem 'Chakra Petch',sans-serif;cursor:pointer;margin-top:18px}
.btn:hover,.btn:focus-visible{filter:brightness(1.12);outline:2px solid var(--tx);outline-offset:2px}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line);margin-left:10px}
.score{font:700 clamp(3rem,12vw,5rem)/1 'Chakra Petch',sans-serif;color:var(--c);margin:8px 0}
.rev{margin-top:14px;display:grid;gap:12px}
.rev div{background:var(--opt);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.93rem}
.rev em{color:var(--ok);font-style:normal}
.up{position:fixed;right:18px;bottom:18px;z-index:30;width:48px;height:48px;border-radius:50%;border:1px solid var(--mint);background:var(--panel);color:var(--mint);font-size:1.3rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
.up.v{opacity:1;pointer-events:auto}
.up:hover,.up:focus-visible{background:var(--mint);color:#04110c;outline:none}
footer{--tx:#e6f1f7;--mut:#8fa8b9;--cy:#36e0ff;background:#050b12;border-top:2px solid var(--mint);box-shadow:0 -10px 40px -20px var(--mint)}
.foot{max-width:980px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.foot img{width:104px;height:104px;object-fit:contain;flex:none}
.foot p{font-size:.95rem;color:var(--mut);line-height:1.55}
.foot .dev{margin-top:8px;color:var(--cy)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>

["¿Cuál es la función principal del kernel?",["Gestionar los recursos y servir de puente entre el hardware y los programas","Editar documentos de texto","Mostrar la interfaz gráfica del escritorio","Conectar el equipo a internet únicamente"],"El kernel administra CPU, memoria y dispositivos, y expone servicios a los programas."],

["En sistemas de archivos tipo Unix, ¿qué guarda un i-node?",["Los metadatos del archivo (permisos, tamaño, ubicación de bloques)","El nombre del archivo y su contenido completo","Solo la fecha de creación","La lista de usuarios conectados"],"El i-node almacena los metadatos; los nombres viven en las entradas de directorio."],
["Un proceso que espera que termine una operación de E/S se encuentra en estado…",["Bloqueado (en espera)","Listo","En ejecución","Terminado"],"Mientras espera un evento externo no puede usar la CPU, por eso está bloqueado."],

["¿Qué ventaja principal ofrece la virtualización?",["Ejecutar varios sistemas operativos aislados en un mismo equipo físico","Hacer que el hardware sea más rápido sin cambiar nada","Eliminar la necesidad de un sistema operativo","Reducir el tamaño de los archivos"],"Permite aprovechar mejor el hardware y aislar entornos entre sí."],
["¿Para qué sirve el journaling en un sistema de archivos?",["Registrar los cambios pendientes para recuperar la consistencia tras una falla","Comprimir los archivos para ahorrar espacio","Cifrar todo el disco","Aumentar el número de particiones"],"Si el equipo se apaga de golpe, el diario permite rehacer o deshacer operaciones incompletas."]]},

["¿Qué algoritmo minimiza el tiempo promedio de espera (si se conocen las duraciones)?",["SJF (primero el trabajo más corto)","FCFS","Round Robin con quantum muy grande","Planificación aleatoria"],"SJF es óptimo en tiempo promedio de espera, aunque requiere conocer las ráfagas."],
["Un socket es…",["Un punto final de comunicación identificado por IP y puerto","Un tipo de memoria caché","Un planificador de procesos","Un formato de archivo"],"Los sockets permiten la comunicación entre procesos, locales o en red."],
["¿Qué comparten los hilos de un mismo proceso?",["Espacio de direcciones (código y datos)","Su pila (stack) y registros","Nada, son independientes","El número de PID de otro proceso"],"Cada hilo tiene su pila y registros, pero comparten código, datos y archivos abiertos."],
["Una condición de carrera ocurre cuando…",["El resultado depende del orden en que varios procesos acceden a un recurso compartido","Un proceso termina antes de empezar","La CPU se apaga","Dos procesos tienen el mismo nombre"],"Se evita con exclusión mutua: semáforos, mutex o monitores."],
["La paginación divide la memoria en bloques de tamaño fijo. ¿Qué problema evita?",["La fragmentación externa","El uso de la CPU","Los errores de red","La pérdida de energía"],"Con páginas y marcos del mismo tamaño, cualquier marco libre sirve para cualquier página."],
["¿Qué es un interbloqueo (deadlock)?",["Procesos que esperan recursos retenidos por otros y ninguno puede avanzar","Un proceso que termina demasiado rápido","Un error de sintaxis en el código","La pérdida de conexión de red"],"Es un ciclo de espera: cada proceso necesita algo que tiene otro del grupo."],
["¿Qué es la fragmentación interna?",["Espacio desperdiciado dentro de un bloque de memoria asignado","Espacios libres pequeños entre bloques ya asignados","Archivos divididos en el disco","Hilos que se dividen en procesos"],"Ocurre cuando se asigna un bloque más grande de lo que el proceso necesita."]]},

["La memoria virtual permite…",["Ejecutar programas más grandes que la RAM usando el disco como respaldo","Aumentar la velocidad de la CPU","Instalar más puertos USB","Eliminar la necesidad del kernel"],"Solo las páginas necesarias residen en RAM; el resto queda en disco."],
["¿Qué es el thrashing?",["Exceso de fallos de página: el sistema pasa más tiempo paginando que ejecutando","Un virus que borra archivos","Un fallo del disco duro","Un tipo de planificador"],"Ocurre cuando los procesos no tienen suficientes marcos para su conjunto de trabajo."],
["¿Qué permite el DMA (acceso directo a memoria)?",["Transferir datos entre un dispositivo y la memoria sin que la CPU copie cada byte","Que la CPU lea directamente del teclado byte a byte","Cifrar los datos del disco","Aumentar el quantum"],"La CPU solo inicia la transferencia y recibe una interrupción al terminar."],
["El principio de mínimo privilegio establece que…",["Cada usuario o proceso solo tiene los permisos indispensables para su tarea","Todos los usuarios deben ser administradores","Los permisos nunca se revisan","Solo el administrador puede iniciar sesión"],"Limita el daño si una cuenta o programa resulta comprometido."],
["En un sistema de tiempo real duro (hard real-time)…",["Incumplir un plazo se considera un fallo del sistema","Los plazos son solo sugerencias","No importa el tiempo de respuesta","Solo se usan en videojuegos"],"Ejemplos: control de frenos ABS o marcapasos."],
["¿Cómo logra un sistema tolerancia a fallos?",["Con redundancia que le permite seguir operando si un componente falla","Apagándose al primer error","Ignorando los errores","Usando un solo componente muy caro"],"Replicación de hardware o datos, y mecanismos de recuperación, evitan interrupciones del servicio."],
["¿Qué es una interrupción?",["Una señal que avisa a la CPU de un evento (por ejemplo, fin de una operación de E/S) para que lo atienda","Un error que apaga el equipo","Un tipo de archivo del sistema","Un programa que bloquea a otros usuarios"],"La CPU pausa lo que hace, ejecuta el manejador de la interrupción y luego continúa."],
["¿Cuál es la diferencia entre autenticación y autorización?",["Autenticar verifica quién eres; autorizar define qué puedes hacer","Son exactamente lo mismo","Autenticar define permisos; autorizar verifica la contraseña","Autenticar cifra datos; autorizar los borra"],"Primero se comprueba la identidad y después se revisan los permisos del usuario."]]}

{n:'Unit 1',c:'#4da3ff',t:['Virtual machines','Kernel and booting','File systems','Processes'],q:[
["Where does a type 1 (bare-metal) hypervisor run?",["Directly on the hardware","On top of a host operating system","Inside a guest virtual machine","Only inside a web browser"],"Type 1 runs directly on the hardware; type 2 runs on top of a host OS."],
["What is the main job of the kernel?",["Managing resources and acting as a bridge between hardware and programs","Editing text documents","Drawing the desktop graphical interface","Only connecting the computer to the internet"],"The kernel manages CPU, memory and devices, and offers services to programs."],
["What is the correct boot order?",["Firmware (BIOS/UEFI) → bootloader → kernel → init/systemd","Kernel → BIOS/UEFI → init → bootloader","Init → kernel → BIOS/UEFI → bootloader","Bootloader → init → BIOS/UEFI → kernel"],"The firmware starts the hardware, the bootloader loads the kernel and the kernel launches the first process."],
["In Unix-like file systems, what does an i-node store?",["The file's metadata (permissions, size, block locations)","The file name and its full contents","Only the creation date","The list of connected users"],"The i-node stores metadata; names live in directory entries."],
["A process waiting for an I/O operation to finish is in the … state.",["Blocked (waiting)","Ready","Running","Terminated"],"While it waits for an external event it can't use the CPU, so it is blocked."],

{n:'Unit 2',c:'#ffc24d',t:['Process scheduling','Distributed systems, sockets and threads','Process concurrency','Memory'],q:[
["In Round Robin, what defines how long each process uses the CPU per turn?",["The quantum","A fixed priority","The file size","The number of threads"],"Round Robin splits CPU time into slices called quantum."],
["Which algorithm minimizes average waiting time (when burst lengths are known)?",["SJF (shortest job first)","FCFS","Round Robin with a very large quantum","Random scheduling"],"SJF is optimal for average waiting time, though it needs to know the bursts."],
["A socket is…",["A communication endpoint identified by an IP address and a port","A type of cache memory","A process scheduler","A file format"],"Sockets let processes communicate, locally or over a network."],
["What do the threads of the same process share?",["Address space (code and data)","Their stack and registers","Nothing, they are independent","The PID of another process"],"Each thread has its own stack and registers, but they share code, data and open files."],
["A race condition happens when…",["The result depends on the order in which several processes access a shared resource","A process finishes before it starts","The CPU turns off","Two processes have the same name"],"It is prevented with mutual exclusion: semaphores, mutexes or monitors."],
["Paging splits memory into fixed-size blocks. Which problem does it avoid?",["External fragmentation","CPU usage","Network errors","Power loss"],"With pages and frames of the same size, any free frame works for any page."],
["What is a deadlock?",["Processes waiting for resources held by others, so none can move forward","A process that finishes too quickly","A syntax error in the code","A lost network connection"],"It is a waiting cycle: each process needs something another process in the group holds."],
["What is internal fragmentation?",["Wasted space inside an allocated memory block","Small free gaps between allocated blocks","Files split across the disk","Threads that split into processes"],"It happens when a block larger than what the process needs is allocated."]]},
{n:'Unit 3',c:'#ff7d6b',t:['Virtual memory','Input/Output (I/O)','Security','Real time, embedded systems and fault tolerance'],q:[
["Virtual memory allows…",["Running programs larger than RAM by using the disk as backup","Making the CPU faster","Installing more USB ports","Removing the need for the kernel"],"Only the needed pages live in RAM; the rest stays on disk."],
["What is thrashing?",["Too many page faults: the system spends more time paging than running","A virus that deletes files","A hard drive failure","A type of scheduler"],"It happens when processes don't have enough frames for their working set."],
["What does DMA (direct memory access) allow?",["Transferring data between a device and memory without the CPU copying every byte","The CPU reading the keyboard byte by byte","Encrypting the disk's data","Increasing the quantum"],"The CPU only starts the transfer and gets an interrupt when it ends."],
["The principle of least privilege states that…",["Each user or process has only the permissions strictly needed for its task","All users should be administrators","Permissions are never reviewed","Only the administrator can log in"],"It limits the damage if an account or program is compromised."],
["In a hard real-time system…",["Missing a deadline counts as a system failure","Deadlines are only suggestions","Response time doesn't matter","They are only used in video games"],"Examples: ABS brake control or pacemakers."],
["How does a system achieve fault tolerance?",["With redundancy that lets it keep operating if a component fails","By shutting down at the first error","By ignoring errors","By using a single, very expensive component"],"Replicating hardware or data, plus recovery mechanisms, prevents service interruptions."],
["What is an interrupt?",["A signal that tells the CPU about an event (for example, the end of an I/O operation) so it can handle it","An error that shuts the computer down","A type of system file","A program that blocks other users"],"The CPU pauses what it is doing, runs the interrupt handler and then continues."],
["What is the difference between authentication and authorization?",["Authentication verifies who you are; authorization defines what you can do","They are exactly the same","Authentication defines permissions; authorization checks the password","Authentication encrypts data; authorization deletes it"],"Identity is checked first, then the user's permissions are reviewed."]]}
];

const D={es:[["Una máquina virtual es un computador simulado por software y se administra con un hipervisor.","El kernel controla el hardware; el arranque pasa del firmware al cargador y luego al kernel.","Organizan los datos en disco con directorios, i-nodes y journaling.","Son programas en ejecución con estados (listo, ejecución, bloqueado) y se crean con fork()."],
["FCFS, SJF y Round Robin deciden qué proceso usa la CPU y por cuánto tiempo.","Varios equipos cooperan por red; los sockets los comunican y los hilos comparten el espacio de su proceso.","Al compartir recursos aparecen las condiciones de carrera, la exclusión mutua y los interbloqueos.","Se asigna con paginación o segmentación y hay que controlar la fragmentación."],
["Usa el disco para extender la RAM mediante paginación por demanda; el exceso de fallos causa thrashing.","Interrupciones, controladores y DMA conectan los dispositivos con la CPU.","Autenticación, autorización y mínimo privilegio protegen el sistema.","Los sistemas de tiempo real cumplen plazos estrictos y la redundancia permite seguir operando ante fallas."]],
en:[["A virtual machine is a computer simulated by software and is managed by a hypervisor.","The kernel controls the hardware; booting goes from firmware to the bootloader and then the kernel.","They organize data on disk with directories, i-nodes and journaling.","They are running programs with states (ready, running, blocked) and are created with fork()."],
["FCFS, SJF and Round Robin decide which process uses the CPU and for how long.","Several computers cooperate over a network; sockets connect them and threads share their process's address space.","Sharing resources brings race conditions, mutual exclusion and deadlocks.","Allocated with paging or segmentation, while fragmentation has to be controlled."],
["Uses the disk to extend RAM through demand paging; too many page faults cause thrashing.","Interrupts, controllers and DMA connect devices to the CPU.","Authentication, authorization and least privilege protect the system.","Real-time systems meet strict deadlines and redundancy keeps them running after failures."]]};

const NQ=8,NF=15,IDS=['u1','u2','u3','final'],COL=['#4da3ff','#ffc24d','#ff7d6b','#2de2a0'];
let lang='es';
const t=(k,...a)=>{const v=L[lang][k];return typeof v==='function'?v(...a):v};
const bank=()=>B[lang],qd=q=>bank()[q.u].q[q.n];
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const go=id=>document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
const best=[null,null,null,null],st=[{v:'intro'},{v:'intro'},{v:'intro'},{v:'intro'}];

// Navegación
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['inicio',...IDS].forEach(id=>io.observe(document.getElementById(id)));
const up=$('#up');up.onclick=()=>go('inicio');
addEventListener('scroll',()=>up.classList.toggle('v',scrollY>500),{passive:true});

// Resumen y tarjetas
function chips(){const tot=[NQ,NQ,NQ,NF];return [0,1,2,3].map(i=>{const n=i<3?bank()[i].n:t('fin');return best[i]===null?`<span class="no">${n}: ${t('pend')}</span>`:`<span style="border-color:${COL[i]}">${n}: ${best[i]}/${tot[i]}</span>`}).join('')}
function upd(){document.querySelectorAll('[data-sum]').forEach(e=>e.innerHTML=chips())}
function side(k){const s=$('#s'+k);
 if(k<3)s.innerHTML=`<h3>${t('sideT')}</h3>`+bank()[k].t.map((x,i)=>`<div class="box"><h3>${x}</h3><p>${D[lang][k][i]}</p></div>`).join('')+`<div class="tip">${t('tipU')}</div>`;
 else s.innerHTML=`<h3>${t('sideF')}</h3>`+bank().map(u=>`<div class="box" style="--c:${u.c}"><h3>${u.n}</h3><p>${u.t.join(' · ')}</p></div>`).join('')+`<div class="tip">${t('tipF')}</div>`}

// Quices
function render(k,sc){const v=st[k].v;v==='intro'?intro(k):v==='quiz'?show(k,sc):result(k,sc)}
function intro(k){
 const tp=k<3?bank()[k].t.join(', '):'';
 $('#q'+k).innerHTML=`<div class="card"><p class="lead" style="margin-top:0">${k<3?t('introU',tp):t('introF')}</p>
 <div class="sum">${t('chips',k<3?NQ:NF).map(x=>`<span>${x}</span>`).join('')}</div>
 ${k===3?`<p class="lead" style="font-size:.95rem;margin-top:18px">${t('best')}</p><div class="sum" data-sum style="margin-top:8px"></div>`:''}
 <button class="btn" onclick="start(${k})">${k<3?t('startQ'):t('startE')}</button></div>`;
 upd();
}
function start(k){
 const mk=(u,n)=>({u,n,perm:shuf([0,1,2,3])});let qs;
 if(k<3)qs=shuf([...Array(NQ).keys()]).map(n=>mk(k,n));
 else{qs=[];[0,1,2].forEach(u=>shuf([...Array(NQ).keys()]).slice(0,5).forEach(n=>qs.push(mk(u,n))));qs=shuf(qs)}
 st[k]={v:'quiz',qs,i:0,pts:0,wrong:[],pick:null};show(k,true);
}
function show(k,sc){
 const s=st[k],q=s.qs[s.i],d=qd(q),n=s.qs.length,box=$('#q'+k),ans=s.pick!==null,last=s.i===n-1;
 let fb='';
 if(ans){const good=q.perm[s.pick]===0;fb=`<p class="fb"><strong>${good?t('ok'):t('bad')}</strong> ${d[2]}</p><button class="btn" id="nx${k}">${last?t('see'):t('next')}</button>`}
 box.innerHTML=`<div class="card"><div class="meta"><span>${t('quizT',k)}</span><span>${t('qOf',s.i+1,n)}</span></div>
 <div class="bar"><i style="width:${s.i/n*100}%"></i></div><h3>${d[0]}</h3>${q.perm.map((o,j)=>{let c='';if(ans){if(o===0)c=' ok';else if(j===s.pick)c=' bad'}return `<button class="opt${c}" data-j="${j}"${ans?' disabled':''}>${d[1][o]}</button>`}).join('')}<div>${fb}</div></div>`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(k,+b.dataset.j));
 const nx=$('#nx'+k);
 if(nx){nx.onclick=()=>{s.i++;s.pick=null;if(s.i===n){s.v='result';if(best[k]===null||s.pts>best[k])best[k]=s.pts;result(k,true)}else show(k,true)}}
 if(sc)box.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
}
function answer(k,j){
 const s=st[k],q=s.qs[s.i];s.pick=j;
 if(q.perm[j]===0)s.pts++;else s.wrong.push({q,j});
 show(k,false);const nx=$('#nx'+k);if(nx)nx.focus({preventScroll:true});
}
function result(k,sc){
 const s=st[k],n=s.qs.length,p=Math.round(s.pts/n*100),msg=p>=80?t('m80'):p>=60?t('m60'):t('m0');
 let by='';
 if(k===3)by='<div class="sum">'+bank().map((u,i)=>{const tt=s.qs.filter(q=>q.u===i),r=tt.filter(q=>!s.wrong.some(w=>w.q===q)).length;return `<span style="border-color:${u.c}">${u.n}: ${r}/${tt.length}</span>`}).join('')+'</div>';
 const nxt=k<3?`<button class="btn ghost" onclick="go('${IDS[k+1]}')">${k<2?t('goU',k+2):t('goF')}</button>`:`<button class="btn ghost" onclick="go('inicio')">${t('home')}</button>`;
 $('#q'+k).innerHTML=`<div class="card"><h3>${t('res')}</h3><p class="score">${s.pts}/${n}</p><p>${t('pct',p)} ${msg}</p>${by}
 <button class="btn" onclick="start(${k})">${t('retry')}</button>${nxt}
 ${s.wrong.length?`<h3 style="margin:28px 0 0">${t('review')}</h3><div class="rev">${s.wrong.map(w=>{const d=qd(w.q);return `<div><strong>${d[0]}</strong><br>${t('yours')} ${d[1][w.q.perm[w.j]]}<br><em>${t('corr')} ${d[1][0]}</em></div>`}).join('')}</div>`:''}</div>`;
 upd();if(sc)$('#q'+k).querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
}

// Tema e idioma
function setTheme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem('ova-theme',m)}catch(e){}
 $('#bTheme').textContent=m==='dark'?'☀ '+t('day'):'☾ '+t('night');$('#bTheme').title=m==='dark'?t('dayT'):t('nightT')}
function setLang(l){lang=l;try{localStorage.setItem('ova-lang',l)}catch(e){}
 document.documentElement.lang=l;document.title=t('title');
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
 $('#bLang').textContent=l==='es'?'EN':'ES';$('#bLang').title=t('langT');
 setTheme(document.documentElement.dataset.theme);[0,1,2,3].forEach(side);[0,1,2,3].forEach(k=>render(k,false));upd()}
$('#bTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#bLang').onclick=()=>setLang(lang==='es'?'en':'es');
let m0='dark',l0='es';try{m0=localStorage.getItem('ova-theme')||'dark';l0=localStorage.getItem('ova-lang')||'es'}catch(e){}
document.documentElement.dataset.theme=m0;setLang(l0);
</script>
